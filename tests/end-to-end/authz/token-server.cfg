# Snippet: authorization by the tokens of the test issuer, which start_issuer
# configures in scitokens.conf with the default user "nobody" and pass-through
# on a missing token. A request with a valid token maps to "nobody", which the
# authorization database grants; a request without a token passes to the
# database as the anonymous identity, which the database denies. The tests use
# this to check that one authorization does not keep the mapped name of an
# earlier one on the same connection.

http.header2cgi Authorization authz strip-on-redirect

ofs.authlib ++ libXrdAccSciTokens.so config=$rundir/../scitokens.conf
ofs.authorize 1
acc.authdb $rundir/../token-server.authdb
