# Snippet: the HTTPS origin of the XrdClHttp tests. Its local root is the
# disk directory of the tape, $rundir/../tape, which the test makes. The OSS
# stacks the statistics and a plugin which makes opens of slow_open.txt slow;
# the throttle wraps the file system.
#
# The Tape REST API needs a durable prepare backend. The mock tape of the
# prepare tests copies a file from $XRD_PREP_MOCK_ROOT/archive to the disk
# directory when it stages the file. The coordinator keeps its requests in
# $rundir/../prepare, which is not in the directory of the mock tape.

oss.localroot $rundir/../tape/disk
ofs.preplib libXrdOfsPrepGPI.so -admit stage,query,cancel,evict -cgi -maxfiles 48 -maxresp 1m -run $testdir/../../XrdOfsPrep/mock_tape.py
ofs.preplib ++ libXrdOfsPrepPersist.so $rundir/../prepare xrdclhttp-mock-tape replay-safe
http.exthandler xrdhttptapeapi libXrdHttpTapeApi.so

ofs.osslib ++ libXrdOssStats.so
ofs.osslib ++ $bindir/../lib/libXrdOssSlowOpen.so
xrootd.fslib ++ throttle

xrootd.chksum max 2 md5 adler32 crc32 crc32c
acc.audit deny grant
acc.authrefresh 300

# Clients of root:// need no authentication
sec.protbind * none
