# Snippet: gsi only, with the shared credentials and the extraction of the
# VOMS attributes, thus the VO of the client is on the monitoring stream. The
# authorization database allows everything to the user "client" of the
# gridmap.

sec.protparm gsi -ca:verify -certdir:$creds
sec.protparm gsi -crl:require -crldir:$creds
sec.protparm gsi -key:$creds/host.key
sec.protparm gsi -cert:$creds/host.pem
sec.protparm gsi -gridmap:$creds/gridmap
sec.protparm gsi -gmapopt:trymap,usedn
sec.protparm gsi -vomsat:extract -vomsfun:libXrdVoms.so -vomsfunparms:dbg
sec.protparm gsi -md:sha512:sha256 -d:1 -trustdns:false
sec.protocol gsi
sec.protbind * only gsi

ofs.authorize 1
acc.authdb $testdir/voms.authdb
