# Snippet: the detailed f-stream to the collector at $COLLECTOR_PORT, with the
# lfn, the requests, the in-flight transfers and the error records of failed
# opens and file errors. Short intervals keep the test fast. "auth" adds the
# protocol and the VO to the user records. fbsz 1024 is the minimum that the
# server allows, and much less than a long open record needs. Thus each
# record crosses a datagram boundary, which tests the bounds of the buffer.

set collector = $COLLECTOR_PORT
xrootd.monitor all flush 2s ident 2s fstat 2s err lfn ops xfr 1 auth fbsz 1024 dest fstat info user io localhost:$collector
