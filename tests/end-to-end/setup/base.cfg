# Configuration common to every server of the end-to-end tests.
#
# start_server (see server.bash) writes this file first, then the role, then
# the extra snippets of the test, into a single configuration file. It sets
# the environment variables below for each server:
#
#   $name     the name of the server
#   $rundir   the directory of the server; its data are in $rundir/data
#   $port     the port of the server
#   $bindir   the directory of the xrootd program
#   $creds    the shared credentials (see credentials.sh)
#   $testdir  the directory of the test file, for its own snippets and files
#   $setupdir the directory of this file

set name   = $SETUP_NAME
set rundir = $SETUP_RUNDIR
set port   = $SETUP_PORT
set bindir = $SETUP_BINDIR
set creds  = $SETUP_CREDENTIALS
set testdir = $SETUP_TESTDIR
set setupdir = $SETUP_SETUPDIR

all.sitename  $name
# xrootd also writes its pid to <pidpath>/<instance name>/xrootd.pid, the
# file of the option -s
all.pidpath   $rundir/..

xrd.maxfd strict 1k
