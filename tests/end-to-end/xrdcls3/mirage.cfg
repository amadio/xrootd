# Snippet: the Mirage OSS, which keeps only the size of a file, returns the
# pattern of the extended attribute "pattern" as its content, and returns the
# errors of the attributes open.return_code, read.return_code and more (see
# src/XrdOssMirage/README.md). It has no directories.

ofs.osslib   libXrdOssMirage.so
ofs.xattrlib libXrdOssMirage.so
