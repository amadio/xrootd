# Snippet: the jwt protocol only, for root:// and for the Authorization header
# of HTTPS (http.jwt), with the issuer configuration which the test writes
# next to the run directory. The authorization database allows /protected to
# the subject alice. A request without a token stays anonymous, and the
# database denies it.

http.jwt on
http.tlsclientauth off

sec.protparm jwt -scitokens-config $rundir/../jwt.conf
sec.protocol jwt
sec.protbind * only jwt

ofs.authorize 1
acc.authdb $testdir/jwt.authdb
