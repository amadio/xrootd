# Role: a proxy without a cache, which serves the files of the origin at
# $ORIGIN with XrdPss, and lets them write. The clients must authenticate with
# unix, as with the role server.

set origin = $ORIGIN

all.export / r/w
xrootd.seclib libXrdSec.so
sec.protocol unix
xrd.port $port

ofs.osslib libXrdPss.so
pss.origin $origin
