# Snippet: the purge of the cache starts above 4 MiB of files and removes the
# files which were read first, down to at most 3 MiB. The purge runs each
# 60 s, which is the shortest interval. The other tests write to the same
# file system, and above the low watermark of the disk the purge removes all
# files, thus the watermarks are high.

pfc.diskusage 0.98 0.99 files 2m 3m 4m
