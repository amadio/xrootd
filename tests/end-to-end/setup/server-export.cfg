# Role: a data server without oss.localroot, which exports only its data
# directory, by the absolute path of the directory. A path of a request is
# then a path of the host, and only the export list limits the paths. The
# authentication is as for the role "server".

all.export $rundir/data

xrootd.seclib libXrdSec.so
sec.protocol unix

xrd.port $port
