# Snippet: the cache of the benchmarks. It replaces the block size, the
# prefetch and the trace of the role cache: the block size and the number of
# blocks to prefetch are in PFC_BLOCKSIZE and PFC_PREFETCH, and the cache
# logs only errors, as a log of each request slows the cache down.

set blocksize = $PFC_BLOCKSIZE
set prefetch = $PFC_PREFETCH

pfc.blocksize $blocksize
pfc.prefetch $prefetch
pfc.trace error
