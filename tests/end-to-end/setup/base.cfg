# Configuration common to every server of the end-to-end tests.
#
# start_server (see server.bash) writes this file first, then the role, then
# the extra snippets of the test, into a single configuration file. It sets
# the environment variables below for each server.

set name   = $SETUP_NAME
set rundir = $SETUP_RUNDIR
set port   = $SETUP_PORT
set bindir = $SETUP_BINDIR

all.sitename  $name
# xrootd also writes its pid to <pidpath>/<instance name>/xrootd.pid, the
# file of the option -s
all.pidpath   $rundir/..

xrd.maxfd strict 1k
