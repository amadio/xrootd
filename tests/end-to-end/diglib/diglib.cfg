# Snippet: the digital library (the paths /=/), for the user of the test with
# sss and the keytab $XrdSecSSSKT, configured by the file $DIGLIB_CONF of the
# test, which the server also publishes as an extra configuration file.

set keytab = $XrdSecSSSKT
set conf = $DIGLIB_CONF

sec.protocol sss -c $keytab -s $keytab -g
sec.protbind * only sss unix

xrootd.diglib * $conf
dig.log deny grant
dig.addconf $conf diglib.conf
